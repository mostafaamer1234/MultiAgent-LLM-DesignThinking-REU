[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-llm"
version = "0.2.0"
description = "Market research and persona agents with optional web augmentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "langchain-openai>=0.2",
  "langchain>=0.3",
  "langgraph>=0.2",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "trafilatura>=1.6",
  "newspaper3k>=0.2.8",
  "nltk>=3.8",
  "aiohttp>=3.9",
  "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
research-llm-api = "research_llm.cli:main"
research-llm-pipeline = "research_llm.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
